<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Mother's Day, Mom!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Animated background hearts -->
    <div class="bg-hearts">
        <div class="bg-heart heart1"></div>
        <div class="bg-heart heart2"></div>
        <div class="bg-heart heart3"></div>
        <div class="bg-heart heart4"></div>
        <div class="bg-heart heart5"></div>
    </div>
    <div class="container">
        <h1>Hello, Mom</h1>
        <p class="subtitle">How are you?</p>
        <div class="buttons">
            <button id="fineBtn" class="main-btn">I'm Fine</button>
            <button id="notGoodBtn" class="main-btn">Not So Good</button>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="script.js"></script>
</body>
</html>
